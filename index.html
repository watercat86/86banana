<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>なんちゃってブラウザ</title>
<style>
:root{--bg:#fff;--fg:#111;--bar:#eee;--control:#ddd;--accent:#0780d7}*[data-theme=dark]{--bg:#0b0b0d;--fg:#e6e6e6;--bar:#111;--control:#222;--accent:#4aa3ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"メイリオ",sans-serif;background:var(--bg);color:var(--fg)}header,.status,.video{display:flex;gap:7px;align-items:center;padding:8px;background:var(--bar)}header input,.video input{flex:1;min-width:0}button,input{font:inherit;color:var(--fg);background:var(--control);border:1px solid #8884;border-radius:6px;padding:7px 9px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.tabs{display:flex;gap:6px;padding:6px;overflow:auto}.tab{display:flex;gap:7px;align-items:center;white-space:nowrap;padding:7px 10px;border-radius:6px;background:var(--control);cursor:pointer}.tab.active{outline:2px solid var(--accent)}main{height:calc(100vh - 110px);display:flex;flex-direction:column}.area{position:relative;flex:1}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.video{display:none}.status{height:36px;font-size:13px;opacity:.85}.status span:last-child{margin-left:auto}.mask{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.message{pointer-events:auto;background:#000b;color:#fff;padding:18px;border-radius:10px;text-align:center;max-width:90%}@media(max-width:640px){header{flex-wrap:wrap}.tools{width:100%;overflow:auto;display:flex}.address{order:2;width:100%;display:flex}}
</style>
</head>
<body>
<header><div class="tools"><button id="back">⬅️</button><button id="next">➡️</button><button id="reload">🔄</button><button id="home">🏠</button><button id="videoToggle">📺アナつべ</button></div><div class="address"><input id="address" placeholder="https://example.com または検索語句"><button id="go">🔍 移動</button><button id="theme">🌙</button></div></header>
<nav class="tabs" id="tabs"><button id="new">＋</button></nav>
<div class="video" id="videoBar"><span>📺</span><input id="videoUrl" placeholder="YouTube / ニコニコ / Instagram の動画リンク"><button id="play">再生</button></div>
<main><div class="area" id="area"></div><div class="status"><span id="tabInfo">タブ: 0</span><span id="statusText">準備完了</span></div></main>
<script>
const $=id=>document.getElementById(id),homeUrl='https://example.com',timeout=10000;let tabs=[],active=-1;
const address=$('address'),area=$('area'),videoBar=$('videoBar');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(s){$('statusText').textContent=s}
function newTab(url=homeUrl){let t={title:'新しいタブ',history:[],pos:-1,frame:null,box:null};tabs.push(t);switchTab(tabs.length-1);go(url)}
function render(){document.querySelectorAll('.tab').forEach(x=>x.remove());tabs.forEach((t,i)=>{let b=document.createElement('div');b.className='tab'+(i===active?' active':'');b.innerHTML=`<span>${esc(t.title||host(t.history[t.pos]))}</span><b>×</b>`;b.onclick=e=>e.target.tagName==='B'?closeTab(i):switchTab(i);$('tabs').insertBefore(b,$('new'))});$('tabInfo').textContent=`タブ: ${tabs.length}`;let t=tabs[active];$('back').disabled=!(t&&t.pos>0);$('next').disabled=!(t&&t.pos<t.history.length-1)}
function switchTab(i){if(i<0||i>=tabs.length)return;if(active>=0&&tabs[active].box)tabs[active].box.style.display='none';active=i;let t=tabs[i];if(!t.frame){t.frame=document.createElement('iframe');t.frame.className='frame';t.frame.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin allow-popups allow-presentation');t.box=document.createElement('div');t.box.className='box';t.box.style.cssText='position:absolute;inset:0';t.box.append(t.frame);area.append(t.box);t.frame.onload=()=>{hide(t);address.value=t.history[t.pos]||'';status('読み込み完了');render()}}t.box.style.display='block';address.value=t.history[t.pos]?.startsWith('search:')?'':t.history[t.pos]||'';videoBar.style.display=t.history[t.pos]==='avtube:'?'flex':'none';render()}
function closeTab(i){tabs[i].box?.remove();tabs.splice(i,1);if(!tabs.length)return newTab();active=Math.min(active,tabs.length-1);switchTab(active)}
function host(u){try{return new URL(u).hostname}catch{return u||''}}
function isSearch(s){return !/^https?:\/\//i.test(s)&&(/\s/.test(s)||!/\.[a-z]{2,}/i.test(s))}
function normalize(s){try{return /^https?:\/\//i.test(s)?new URL(s).href:'https://'+s}catch{return null}}
function mask(t,msg,err=false){let m=t.box.querySelector('.mask')||Object.assign(document.createElement('div'),{className:'mask'});m.innerHTML=`<div class="message">${err?'⚠️ ':''}${esc(msg)}${err?'<br><button onclick="retry()">再試行</button>':''}</div>`;t.box.append(m)}
function hide(t){t.box.querySelector('.mask')?.remove()}
function retry(){let t=tabs[active];go(t.history[t.pos])}
function push(t,u){t.history=t.history.slice(0,t.pos+1);t.history.push(u);t.pos++}
function go(raw,record=true){let t=tabs[active];if(!t)return;videoBar.style.display='none';if(isSearch(raw))return search(t,raw,record);let u=normalize(raw);if(!u)return status('無効なURLです');if(record)push(t,u);mask(t,'読み込み中…');address.value=u;status('読み込み開始：'+u);clearTimeout(t.timer);t.timer=setTimeout(()=>{mask(t,'このサイトは埋め込み表示を許可していないか、応答が遅れています。',true);status('タイムアウト')},timeout);t.frame.src=u;render()}
async function search(t,q,record=true){if(record)push(t,'search:'+q);mask(t,'検索中…');address.value=q;try{let r=await fetch('https://r.jina.ai/https://html.duckduckgo.com/html/?q='+encodeURIComponent(q));if(!r.ok)throw Error(r.status);let text=await r.text(),a=[],re=/\[([^\]]{3,200})\]\((https?:\/\/[^\s)]+)\)/g,m;while((m=re.exec(text))&&a.length<20)if(!/duckduckgo|r\.jina\.ai/i.test(m[2]))a.push(m);t.frame.srcdoc=`<body style="font:16px system-ui;padding:20px;background:${document.documentElement.dataset.theme==='dark'?'#0b0b0d':'white'};color:inherit"><h2>「${esc(q)}」の検索結果</h2>${a.map(x=>`<p><a href="${esc(x[2])}" target="_blank">${esc(x[1])}</a><br><small>${esc(x[2])}</small></p>`).join('')||'<p>結果がありません。</p>'}</body>`;t.title='検索: '+q;hide(t);status('検索完了');render()}catch(e){mask(t,'検索結果を取得できませんでした。',true);status('検索エラー')}}
function openVideo(t,record=true){if(record)push(t,'avtube:');videoBar.style.display='flex';address.value='avtube:';t.frame.srcdoc='<body style="font:16px system-ui;text-align:center;padding:20vh">📺<br>動画リンクを貼って再生してください</body>';render()}
function playVideo(){let t=tabs[active],u=$('videoUrl').value.trim(),src;if(!u)return;if(/youtube\.com|youtu\.be/.test(u)){let m=u.match(/(?:v=|youtu\.be\/)([\w-]+)/);if(m)src='https://www.youtube-nocookie.com/embed/'+m[1]}else if(/nicovideo\.jp\/watch\//.test(u))src='https://embed.nicovideo.jp/watch/'+u.split('watch/')[1];else if(/instagram\.com/.test(u))src=u.replace(/\/$/,'')+'/embed/';if(!src)return alert('対応していない動画リンクです。');t.frame.src=src;status('動画を再生中');}
$('go').onclick=()=>address.value.trim()&&go(address.value.trim());address.onkeydown=e=>e.key==='Enter'&&$('go').click();$('new').onclick=()=>newTab();$('videoToggle').onclick=()=>openVideo(tabs[active]);$('play').onclick=playVideo;$('back').onclick=()=>{let t=tabs[active];if(t.pos>0){t.pos--;go(t.history[t.pos],false)}};$('next').onclick=()=>{let t=tabs[active];if(t.pos<t.history.length-1){t.pos++;go(t.history[t.pos],false)}};$('reload').onclick=()=>{let t=tabs[active];if(t&&t.pos>=0)go(t.history[t.pos],false)};$('home').onclick=()=>go(homeUrl);$('theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark'?'':'dark';document.documentElement.dataset.theme=d;localStorage.theme=d;$('theme').textContent=d?'☀️':'🌙'};document.documentElement.dataset.theme=localStorage.theme||'';newTab();
</script></body></html>
